<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Teste de formulario</title>
</head>
<body>
  <form onsubmit="document.querySelector('#resultado').textContent='enviado'; return false;">
    <label>Nome <input name="nome"></label>
    <label>Email <input name="email" placeholder="Email"></label>
    <label>Estado
      <select name="estado">
        <option value="RN">RN</option>
        <option value="SP">SP</option>
      </select>
    </label>
    <label><input type="checkbox" name="termos"> Aceito os termos</label>
    <button type="submit">Enviar</button>
  </form>
  <div id="resultado"></div>
</body>
</html>
